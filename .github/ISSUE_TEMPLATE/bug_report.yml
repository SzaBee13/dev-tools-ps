name: Bug report
description: Report a reproducible problem in dev-tools-ps
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please provide as much detail as possible so we can reproduce and fix it.

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What went wrong?
      placeholder: A clear and concise description of the issue.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps and command examples.
      placeholder: |
        1. Run `dev ...`
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      description: Paste any terminal errors, stack traces, or screenshots.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: Which release are you using?
      placeholder: v1.2.1
    validations:
      required: true

  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      description: Output of `$PSVersionTable.PSVersion`
      placeholder: 7.5.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Windows version/build
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: components
    attributes:
      label: Affected component
      description: Which area is impacted?
      multiple: true
      options:
        - PowerShell core (`src/`)
        - Command scripts (`src/commands/`)
        - Chrome extension (`chrome-extension/`)
        - Native host scripts (`chrome-extension/native-host/`)
        - Web docs (`web/`)
        - Installer / packaging (`inno/`, `chocolatey/`)

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this on the latest release.
          required: true
